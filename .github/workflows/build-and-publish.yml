name: Build and Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.23'
          check-latest: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Unit Tests
        run: go test -v -race ./...

  build:
    name: Build Binaries
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux
          - goos: linux
            goarch: amd64
            archive_format: tar.gz
          - goos: linux
            goarch: arm64
            archive_format: tar.gz
          # macOS (Darwin)
          - goos: darwin
            goarch: amd64
            archive_format: tar.gz
          - goos: darwin
            goarch: arm64
            archive_format: tar.gz
          # Windows
          - goos: windows
            goarch: amd64
            archive_format: zip
          - goos: windows
            goarch: arm64
            archive_format: zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.23'
          check-latest: true

      - name: Set Version Variable
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=dev-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cross-Compile Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p build_output
          BIN_NAME="tide"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BIN_NAME="tide.exe"
          fi
          go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.TAG }}" -o "build_output/${BIN_NAME}" ./cmd/tide

      - name: Package Archive
        run: |
          ARCHIVE_NAME="tide_${{ steps.version.outputs.TAG }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p dist
          if [ "${{ matrix.archive_format }}" = "tar.gz" ]; then
            tar -czvf "dist/${ARCHIVE_NAME}.tar.gz" -C build_output .
          else
            cd build_output && zip "../dist/${ARCHIVE_NAME}.zip" * && cd ..
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tide-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 14

  publish:
    name: Publish Release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release_assets
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
